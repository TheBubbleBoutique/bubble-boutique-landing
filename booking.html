<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Visit · The Bubble Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3E8D2;
    --gold:#C6A153;
    --gold-deep:#A8813A;
    --dustyblue:#AFCBD4;
    --dustyblue-deep:#7FA4B0;
    --sage:#A9BFA0;
    --sage-deep:#7E9773;
    --clay:#D3A48A;
    --clay-deep:#B27E62;
    --ink:#1C1A16;
    --card:#FBF6EA;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background:var(--cream);
    font-family:'Nunito Sans', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:36px 20px 48px;
    position:relative;
    background:
      radial-gradient(circle at 15% 20%, rgba(198,161,83,0.16) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(198,161,83,0.14) 0, transparent 42%),
      var(--cream);
  }

  .sparkle-field{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .fleck{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, #F4DFA0 0%, var(--gold) 60%, transparent 100%);
    box-shadow:0 0 8px 2px rgba(198,161,83,0.5);
    opacity:0;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0; transform:scale(0.5); }
    50%{ opacity:0.9; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .fleck{ animation:none; opacity:0.3; }
  }

  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo-wrap{
    width:min(60vw, 200px);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 14px 34px rgba(28,26,22,0.16);
    margin-bottom:18px;
    background:var(--card);
    padding:8px;
  }
  .logo-wrap img{
    width:100%;
    height:auto;
    display:block;
    border-radius:16px;
  }

  p.lede{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(18px, 4.6vw, 21px);
    color:var(--ink);
    opacity:0.85;
    max-width:320px;
    line-height:1.5;
    margin-bottom:8px;
  }

  p.sub{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    opacity:0.55;
    margin-bottom:30px;
  }

  .choices{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .choice{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
    background:var(--card);
    border-radius:18px;
    padding:18px 20px;
    box-shadow:0 6px 18px rgba(28,26,22,0.10);
    border:1.5px solid rgba(198,161,83,0.3);
    text-align:left;
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .choice:active{ transform:scale(0.98); }
  .choice:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(28,26,22,0.16);
  }

  .choice.bath:hover{ border-color:var(--dustyblue-deep); }
  .choice.full-groom:hover{ border-color:var(--gold); }
  .choice.nail-trim:hover{ border-color:var(--clay-deep); }
  .choice.puppy-grooming:hover{ border-color:var(--sage-deep); }

  .icon{
    flex:0 0 auto;
    width:46px;
    height:46px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
  }
  .choice.bath .icon{ background:linear-gradient(155deg, var(--dustyblue), var(--dustyblue-deep)); }
  .choice.full-groom .icon{ background:linear-gradient(155deg, var(--gold), var(--gold-deep)); }
  .choice.nail-trim .icon{ background:linear-gradient(155deg, var(--clay), var(--clay-deep)); }
  .choice.puppy-grooming .icon{ background:linear-gradient(155deg, var(--sage), var(--sage-deep)); }

  .choice-text strong{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    display:block;
  }
  .choice-text span{
    font-size:13.5px;
    font-weight:600;
    opacity:0.62;
  }

  footer{
    position:relative;
    z-index:1;
    margin-top:32px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--ink);
    opacity:0.45;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="sparkle-field" id="sparkles"></div>

  <main>
    <div class="logo-wrap">
      <img src="logo.png" alt="The Bubble Boutique — Dog Grooming Spa">
    </div>

    <p class="lede">What are we booking in for?</p>
    <p class="sub">Pick a service to see real available times</p>

    <div class="choices">
      <a class="choice bath" href="https://cal.eu/bubbleboutique/bath">
        <span class="icon">🛁</span>
        <span class="choice-text">
          <strong>Bath</strong>
          <span>A refreshing wash and dry</span>
        </span>
      </a>

      <a class="choice full-groom" href="https://cal.eu/bubbleboutique/full-groom">
        <span class="icon">✂️</span>
        <span class="choice-text">
          <strong>Full Groom</strong>
          <span>The complete treatment</span>
        </span>
      </a>

      <!--
      <a class="choice nail-trim" href="https://cal.eu/bubbleboutique/nail-trim">
        <span class="icon">💅</span>
        <span class="choice-text">
          <strong>Nail Trim</strong>
          <span>Quick and gentle</span>
        </span>
      </a>
      -->

      <a class="choice puppy-grooming" href="https://cal.eu/bubbleboutique/puppy-grooming">
        <span class="icon">🐶</span>
        <span class="choice-text">
          <strong>Puppy Grooming</strong>
          <span>A gentle first introduction</span>
        </span>
      </a>
    </div>
  </main>

  <footer>THE BUBBLE BOUTIQUE &middot; <a href="https://www.instagram.com/the_bubble_boutique_/" style="color:inherit;">@the_bubble_boutique_</a> &middot; <a href="policies.html" style="color:inherit;">Salon Policies</a></footer>

<script>
  const field = document.getElementById('sparkles');
  const count = window.innerWidth < 480 ? 18 : 28;
  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'fleck';
    const size = 5 + Math.random() * 8;
    f.style.width = size + 'px';
    f.style.height = size + 'px';
    f.style.left = Math.random() * 100 + '%';
    f.style.top = Math.random() * 100 + '%';
    f.style.animationDuration = (1.4 + Math.random() * 2.2) + 's';
    f.style.animationDelay = (Math.random() * 2.5) + 's';
    field.appendChild(f);
  }
</script>

</body>
</html>
